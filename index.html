<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#ffffff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="EasyBake" />
		<title>EasyBake</title>
		<link rel="icon" href="./favicon.ico" type="image/x-icon" />
		<link rel="manifest" href="./site.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
		<style>
			#app-boot-shell {
			display: grid;
			place-items: center;
			gap: 14px;
			width: 100%;
			height: 100vh;
			min-height: 320px;
			padding: 24px;
			box-sizing: border-box;
			background: #ffffff;
			color: #1d1d1f;
			font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			text-align: center;
		}

		#app-boot-shell::before {
			width: 24px;
			height: 24px;
			border: 2px solid #d2d2d7;
			border-top-color: #1d1d1f;
			border-radius: 50%;
			animation: app-boot-spin 0.8s linear infinite;
			content: "";
		}

		@keyframes app-boot-spin {
			to {
				transform: rotate(360deg);
			}
		}
		</style>
	</head>
	<body>
		<div id="root">
			<div id="app-boot-shell" role="status" aria-live="polite">正在打开 EasyBake...</div>
		</div>
		<noscript>请启用 JavaScript 后继续使用 EasyBake。</noscript>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
